[package]
name = "luma-transfer-hook"
version = "0.1.0"
description = "Token-2022 transfer hook enforcing LUMA KYC registry on every transfer"
edition = "2021"
rust-version = "1.79"

[lib]
crate-type = ["cdylib", "lib"]
name = "luma_transfer_hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "luma-batch/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["interface-instructions"] }
anchor-spl = { version = "0.30.1", features = ["token_2022", "token_2022_extensions"] }
spl-transfer-hook-interface = "0.6.3"
spl-tlv-account-resolution = "0.6.3"
luma-batch = { path = "../luma-batch", features = ["cpi"] }
